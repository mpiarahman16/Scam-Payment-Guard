<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino Dreams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Sniglet:wght@400;800&display=swap">
<style>
/* Layout: one night-sky stage; setup card → storybook page (picture over words) → goodnight. Deliberately single dark theme for bedtime. */
:root{
  --night:#0d1230;
  --dusk:#1b2250;
  --ink:#141a3d;
  --moon:#f4ebcb;
  --moon-dim:#c9c1a3;
  --lavender:#b9b3ec;
  --sage:#93cdb0;
  --ember:#f2bc86;
  --line:rgba(185,179,236,.22);
  --panel:rgba(20,26,61,.72);
  --display:"Sniglet","Baloo 2","Comic Sans MS",ui-rounded,system-ui,sans-serif;
  --read:"Andika","Nunito","Verdana",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
img,svg{max-width:100%}
html,body{height:100%}
body{margin:0;font-size:14px}
body{
  background:var(--night);color:var(--moon);font-family:var(--read);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 80% 0%,#283271 0%,var(--dusk) 35%,var(--night) 75%)}
#dim{position:fixed;inset:0;background:#02030a;opacity:0;pointer-events:none;z-index:5;transition:opacity 2.5s ease}
#lights{position:fixed;inset:0;z-index:20;background:#020309;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;cursor:pointer;opacity:0;transition:opacity 3s ease;padding:24px}
#lights.on{opacity:1}
#lights .tinymoon{width:56px;height:56px;border-radius:50%;background:var(--moon-dim);box-shadow:0 0 40px 8px rgba(244,235,203,.12);opacity:.5}
#lights p{font-family:var(--display);color:#5d5a73;font-size:1.3rem;margin:0}
#lights small{color:#3a3850;font-size:.85rem}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding-block:28px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px;border-radius:10px}

/* ---------- Setup ---------- */
.brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.brand svg{width:64px;height:64px;flex:none}
.brand h1{font-size:clamp(2.2rem,7vw,3.4rem);line-height:1;color:var(--moon);letter-spacing:.5px}
.lede{color:var(--lavender);font-size:1.05rem;line-height:1.55;max-width:60ch;margin:6px 0 26px}
.setup{display:flex;flex-direction:column;gap:26px}
.field{display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--display);font-size:1.25rem;color:var(--moon)}
.hint{color:var(--lavender);font-size:.92rem;opacity:.85}
input[type=text]{font:inherit;font-size:1.3rem;padding:14px 16px;border-radius:16px;border:2px solid var(--line);
  background:rgba(13,18,48,.7);color:var(--moon);width:100%;max-width:420px;box-sizing:border-box}
input[type=text]::placeholder{color:#7d7aa3}
input[type=text]:focus{border-color:var(--lavender);outline:none}
.ages{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:48px;height:48px;padding:0 14px;border-radius:24px;border:2px solid var(--line);background:transparent;
  font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--moon);color:var(--ink);border-color:var(--moon)}
.dinos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 12px;border-radius:20px;
  border:2px solid var(--line);background:rgba(20,26,61,.55);transition:transform .2s,border-color .2s,background .2s}
.dcard svg{width:100%;max-width:130px;height:auto}
.dcard .nm{font-family:var(--display);font-size:1.1rem}
.dcard .sp{font-size:.82rem;color:var(--lavender)}
.dcard[aria-pressed=true]{border-color:var(--ember);background:rgba(242,188,134,.12)}
.dcard[aria-pressed=true]::after{content:"★";position:absolute;top:8px;right:12px;color:var(--ember);font-size:1.1rem}
.dcard:hover{transform:translateY(-2px)}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.scard{text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:rgba(20,26,61,.55);display:flex;flex-direction:column;gap:4px}
.scard b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.scard span{font-size:.88rem;color:var(--lavender);line-height:1.4}
.scard[aria-pressed=true]{border-color:var(--sage);background:rgba(147,205,176,.12)}
.voicerow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:rgba(13,18,48,.85);color:var(--moon);max-width:100%;min-width:0;flex:1 1 240px}
select:focus{border-color:var(--lavender);outline:none}
.go{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:40px;border:none;
  background:var(--moon);color:var(--ink);font-family:var(--display);font-size:1.4rem;box-shadow:0 0 30px rgba(244,235,203,.25)}
.go:hover{background:#fff6dc}
.note{font-size:.88rem;color:var(--lavender);opacity:.8;max-width:60ch;line-height:1.5}

/* ---------- Story ---------- */
.story{display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.topbar h2{font-size:1.25rem;color:var(--lavender)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.ghost{padding:9px 14px;border-radius:22px;border:2px solid var(--line);background:rgba(13,18,48,.6);font-size:.95rem}
.ghost[aria-pressed=true]{border-color:var(--sage);color:var(--sage)}
.pic{border-radius:26px;overflow:hidden;border:2px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45);aspect-ratio:16/9;max-width:100%;background:var(--ink)}
.pic svg{display:block;width:100%;height:100%}
.words{min-height:7.5em;font-size:clamp(1.2rem,3.4vw,1.55rem);line-height:1.65;color:var(--moon);max-width:60ch}
.words p{margin:0 0 .6em}
.words h3{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--ember);margin-bottom:.4em}
.words.fade{animation:fadein 1.4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.navbtn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:30px;border:2px solid var(--line);background:rgba(20,26,61,.7);font-family:var(--display);font-size:1.15rem}
.navbtn.primary{background:var(--moon);color:var(--ink);border-color:var(--moon)}
.navbtn:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(185,179,236,.25)}
.dots i.done{background:rgba(244,235,203,.55)}
.dots i.now{background:var(--moon);box-shadow:0 0 10px var(--moon)}
.endrow{display:flex;gap:10px;flex-wrap:wrap}

/* SVG animation classes */
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.25}}
.ff{animation:ff 7s ease-in-out infinite}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.95}50%{transform:translate(10px,-22px);opacity:.35}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.88)}50%{transform:scale(1.12)}}
.zz{animation:zz 5s ease-in-out infinite;opacity:0}
@keyframes zz{0%{transform:translate(0,0);opacity:0}25%{opacity:.9}100%{transform:translate(14px,-40px);opacity:0}}
.rain{animation:rain 1.6s linear infinite}
@keyframes rain{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:rip 5s ease-out infinite}
@keyframes rip{0%{transform:scale(.3);opacity:.8}100%{transform:scale(2.2);opacity:0}}
.glow{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){
  .tw,.ff,.breathe,.zz,.rain,.ripple,.glow,.sway,.words.fade{animation:none!important}
  .zz{opacity:.7}
}
@media (max-width:520px){
  .navbtn{padding:12px 16px;font-size:1.05rem}
  .dinos{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="dim" aria-hidden="true"></div>

<main id="app"></main>

<div id="lights" hidden role="button" tabindex="0" aria-label="Tap to turn the lights back on">
  <div class="tinymoon"></div>
  <p id="lightsText">Goodnight</p>
  <small>Tap to turn the light back on</small>
</div>

<script>
/* ================= Data ================= */
const DINOS = {
  tri:   {name:"Tilly",   kind:"Triceratops",     body:"#9ec7a6", dark:"#6f9f86", belly:"#d4ebd3",
          act:"rested three soft horns on a pillow of moss", short:"Horns down on the moss."},
  brachio:{name:"Bramble", kind:"Brachiosaurus",  body:"#a8b6e8", dark:"#7887c4", belly:"#d8def6",
          act:"lowered a long, long neck, all the way down to the ground", short:"Long neck, all the way down."},
  stego: {name:"Stella",  kind:"Stegosaurus",     body:"#e7b3a2", dark:"#c4867a", belly:"#f6dccf",
          act:"let the plates on its back settle, one by one, like a folding fan", short:"Back plates fold down, one by one."},
  rex:   {name:"Rory",    kind:"T. rex",          body:"#c8a8de", dark:"#9a7cb7", belly:"#e9dbf3",
          act:"tucked two tiny arms under a big, sleepy chin", short:"Tiny arms, tucked in tight."},
  ankylo:{name:"Ollie",   kind:"Ankylosaurus",    body:"#dbc792", dark:"#ad9a64", belly:"#f1e6c4",
          act:"curled a round club tail close, just like a blanket", short:"Tail curls up like a blanket."},
  ptera: {name:"Pip",     kind:"Pteranodon",      body:"#91c6d8", dark:"#5f97ad", belly:"#cfe8f0",
          act:"folded two wide wings and drifted softly down to land", short:"Wings fold in. Soft landing."},
  para:  {name:"Parsley", kind:"Parasaurolophus", body:"#e4a8c0", dark:"#b97a96", belly:"#f5d8e4",
          act:"hummed one last low, gentle note through a curvy crest", short:"Hmmm, a soft, sleepy hum."}
};
const ORDER = ["tri","brachio","stego","rex","ankylo","ptera","para"];
const HORN = "#f5ecd2", EYE = "#1d1a2e";

const STORIES = [
 {id:"meadow", title:"The Moonlit Meadow", blurb:"Fireflies, cool grass and a big, breathing moon.", place:"meadow", pages:[
  {set:"meadow", fx:["moon"],
   long:c=>`Once upon a time, when the sky turned soft and blue, ${c.name} walked into a quiet meadow.\nThe grass was cool. The air smelled like clover. And there, waiting under the moon, ${c.were} ${c.listFull}.`,
   short:c=>`The sky is soft and blue.\n${c.name} walks into a quiet meadow.\nHello, ${c.list}!`},
  {set:"meadow", focus:0, fx:["moon"],
   long:c=>`${c.d(0).name} came close and gave ${c.name} a gentle nuzzle.\n"We are so glad you came," ${c.d(0).name} whispered. "It is almost time to rest."`,
   short:c=>`${c.d(0).name} says hello.\nNuzzle, nuzzle.\n"Hello, ${c.name}."`},
  {set:"meadow", fx:["moon","fireflies"],
   long:c=>`Tiny fireflies floated up from the grass. One... two... three...\nThey blinked slow and golden, like little lanterns, and drifted higher and higher toward the stars.`,
   short:c=>`Look! Fireflies.\nOne... two... three.\nBlink... blink... blink.`},
  {set:"meadow", fx:["breathe","fireflies"],
   long:c=>`The big round moon took a slow, deep breath.\n${c.name} breathed in with the moon... and out with the moon.\nIn... and out. Everyone in the meadow felt calm and warm.`,
   short:c=>`Breathe in with the moon.\nAnd breathe out.\nIn... and out.`},
  {set:"meadow", sleepy:true, fx:["moon"], kind:"actions"},
  {set:"meadow", sleepy:true, fx:["moon","manystars"],
   long:c=>`The stars came out to tuck everyone in, a soft blanket of light across the whole sky.\nThe wind hummed a quiet hum. The grass swayed... slow... slow... slow.`,
   short:c=>`The stars come out.\nTwinkle, twinkle.\nShh...`},
  {set:"meadow", sleepy:true, fx:["moon","zz"],
   long:c=>`${c.name} snuggled close to ${c.list}.\nTheir big dinosaur hearts went thump... thump... thump, slow and steady, like a lullaby.`,
   short:c=>`Snuggle up close.\nThump... thump... thump.`},
  {set:"meadow", sleepy:true, fx:["moon","zz","manystars"], kind:"goodnight"}
 ]},
 {id:"river", title:"The Starry River", blurb:"A still river that holds the whole sky inside it.", place:"river", pages:[
  {set:"river", fx:["moon"],
   long:c=>`${c.name} walked down to a slow, sleepy river with ${c.listFull}.\nThe water was so still that it held the whole sky inside it, every star and the moon too.`,
   short:c=>`${c.name} and ${c.list} go to the river.\nThe water is still.\nThe stars are in the water!`},
  {set:"river", focus:0, fx:["moon","ripple"],
   long:c=>`${c.d(0).name} dipped one toe in the water. Plip.\nLittle circles spread out, wider... and wider... and then softly faded away.`,
   short:c=>`${c.d(0).name} dips a toe.\nPlip.\nLittle circles in the water.`},
  {set:"river", focus:1, fx:["moon","manystars"],
   long:c=>`"Let's count the stars in the river," said ${c.d(1).name}.\nOne... two... three... four... five...\n${c.name} counted too, slower... and slower... and slower.`,
   short:c=>`Let's count the stars.\nOne... two... three...`},
  {set:"river", fx:["breathe","ripple"],
   long:c=>`The river moved like a long, slow breath.\nBreathe in, like the water rolling up.\nBreathe out, like the water rolling away. In... and out.`,
   short:c=>`The river breathes.\nIn... and out.\nIn... and out.`},
  {set:"river", sleepy:true, fx:["moon"], kind:"actions"},
  {set:"river", sleepy:true, fx:["moon"],
   long:c=>`From the reeds, the frogs sang a soft song. Ribbit... ribbit... ever so quietly.\nThe willow trees swayed and whispered, shh... shh... shh.`,
   short:c=>`Ribbit... ribbit...\nThe trees whisper, shh.`},
  {set:"river", sleepy:true, fx:["moon","zz"],
   long:c=>`${c.name} lay down on the cool, soft moss by the water.\n${c.list} curled up close, warm and safe, while the river hummed its sleepy song.`,
   short:c=>`Lie down on the soft moss.\nWarm and safe.\nShh...`},
  {set:"river", sleepy:true, fx:["moon","zz","manystars"], kind:"goodnight"}
 ]},
 {id:"cave", title:"The Cozy Cave", blurb:"Gentle rain outside, glowing crystals inside.", place:"cozy cave", pages:[
  {set:"cave", fx:["rain"],
   long:c=>`Pitter, patter. A gentle rain began to fall.\n${c.listFull} led ${c.name} along a little path to a cozy cave, warm and dry, glowing with soft crystals.`,
   short:c=>`Pitter, patter. Rain!\n${c.list} and ${c.name} go into a cozy cave.`},
  {set:"cave", focus:0, fx:["rain"],
   long:c=>`Inside, the crystals glowed pale blue and lavender, like tiny night-lights.\n${c.d(0).name} touched one with a nose, and it hummed... mmmm.`,
   short:c=>`The crystals glow, like night-lights.\n${c.d(0).name} says, "Mmmm."`},
  {set:"cave", fx:["rain"],
   long:c=>`Outside, the rain kept falling. Pitter, patter, pitter, patter.\nIt was the most peaceful sound in the whole wide world.`,
   short:c=>`Listen to the rain.\nPitter, patter.\nPitter, patter.`},
  {set:"cave", focus:1, fx:["rain","breathe"],
   long:c=>`${c.d(1).name} showed ${c.name} the dinosaur way to rest.\nBreathe in slowly, like smelling a flower...\nand breathe out slowly, like blowing on a dandelion.`,
   short:c=>`Smell the flower. Breathe in.\nBlow the dandelion. Breathe out.`},
  {set:"cave", sleepy:true, fx:["rain"], kind:"actions"},
  {set:"cave", sleepy:true, fx:["softrain"],
   long:c=>`The rain grew softer... and softer... until it was only a whisper.\nDrip... drop... drip.`,
   short:c=>`The rain is soft now.\nDrip... drop... drip.`},
  {set:"cave", sleepy:true, fx:["softrain","zz"],
   long:c=>`${c.name} snuggled into a nest of soft ferns.\n${c.list} gathered round, warm as a hug, and the crystals dimmed to a gentle glow.`,
   short:c=>`A nest of soft ferns.\nWarm as a hug.\nShh...`},
  {set:"cave", sleepy:true, fx:["softrain","zz"], kind:"goodnight"}
 ]}
];

function actionsText(c, young){
  if(young){
    return c.D.map(d=>`${d.name} yawns.\n${d.short}`).join("\n") + `\n${c.name} yawns too.`;
  }
  return `One by one, the dinosaurs got cozy.\n` + c.D.map(d=>`${d.name} ${d.act}.`).join("\n") + `\nThen ${c.name} gave a big, slow yawn too.`;
}
function goodnightText(c, place, young){
  const lines = c.D.map(d=> young ? `${d.name} says, "Goodnight, ${c.name}."` : `"Goodnight, ${c.name}," whispered ${d.name}.`);
  lines.push(young ? `Goodnight, moon. Goodnight, stars.\nSweet dreams, ${c.name}.` : `Goodnight, ${place}. Goodnight, moon. Goodnight, stars.\nSweet dinosaur dreams, ${c.name}.`);
  return lines.join("\n");
}

/* ================= State ================= */
let state = {name:"", age:4, picks:["tri","brachio"], story:"meadow", voiceURI:"", pace:"regular"};
try{ const s = JSON.parse(localStorage.getItem("dinoDreams")||"null"); if(s) state = Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem("dinoDreams", JSON.stringify(state)); }catch(e){} }
let page = 0, current = null, readAloud = false;

/* ================= Drawing ================= */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function eye(x,y,closed){
  return closed
    ? `<path d="M${x-3.2} ${y} q3.2 3 6.4 0" stroke="${EYE}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : `<circle cx="${x}" cy="${y}" r="2.8" fill="${EYE}"/><circle cx="${x+1}" cy="${y-1}" r="1" fill="#fff"/>`;
}
const blush=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="3.4" ry="2" fill="#f29aab" opacity=".55"/>`;
const smile=(x,y)=>`<path d="M${x} ${y} q3 2.4 6 0" stroke="${EYE}" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/>`;
const legs=(xs,y,h,c)=>xs.map(x=>`<rect x="${x}" y="${y}" width="10" height="${h}" rx="4.5" fill="${c}"/>`).join("");

function dino(key, closed){
  const d = DINOS[key], B=d.body, K=d.dark, L=d.belly;
  switch(key){
  case "tri": return `
    <path d="M28 62 Q12 66 4 78 Q18 76 32 72Z" fill="${B}"/>
    ${legs([34,64],72,18,K)}
    <ellipse cx="56" cy="64" rx="32" ry="19" fill="${B}"/>
    ${legs([46,76],74,16,B)}
    <ellipse cx="58" cy="72" rx="22" ry="8" fill="${L}"/>
    <circle cx="86" cy="50" r="17" fill="${K}"/>
    <circle cx="80" cy="42" r="2.5" fill="${L}" opacity=".6"/><circle cx="76" cy="52" r="2.5" fill="${L}" opacity=".6"/>
    <path d="M86 42 L91 26 L95 43Z" fill="${HORN}"/>
    <ellipse cx="97" cy="60" rx="15" ry="12" fill="${B}"/>
    <path d="M100 48 L108 34 L106 50Z" fill="${HORN}"/>
    <path d="M107 55 L114 47 L112 59Z" fill="${HORN}"/>
    ${eye(99,57,closed)}${blush(104,63)}${smile(101,66)}`;
  case "brachio": return `
    <path d="M20 66 Q6 70 2 84 Q14 78 26 72Z" fill="${B}"/>
    ${legs([26,56],72,18,K)}
    <path d="M60 64 Q84 54 90 20" stroke="${B}" stroke-width="13" fill="none" stroke-linecap="round"/>
    <ellipse cx="44" cy="66" rx="28" ry="17" fill="${B}"/>
    ${legs([38,66],72,18,B)}
    <ellipse cx="46" cy="73" rx="18" ry="6.5" fill="${L}"/>
    <circle cx="34" cy="58" r="3" fill="${K}" opacity=".5"/><circle cx="46" cy="54" r="2.4" fill="${K}" opacity=".5"/><circle cx="56" cy="60" r="2.8" fill="${K}" opacity=".5"/>
    <ellipse cx="96" cy="17" rx="12" ry="8" fill="${B}"/>
    ${eye(98,14,closed)}${blush(103,19)}${smile(100,20)}`;
  case "stego": {
    let plates="";
    [30,40,50,60,70,80].forEach((x,i)=>{
      const t=(x-56)/32, y=64-18*Math.sqrt(Math.max(0,1-t*t))+5, h=i%2?12:15;
      plates+=`<path d="M${x-6} ${y} L${x} ${y-h} L${x+6} ${y}Z" fill="${K}"/>`;
    });
    return `
    <path d="M28 60 Q12 62 4 72 Q16 72 30 70Z" fill="${B}"/>
    <path d="M8 67 L3 58 L12 65Z M15 66 L12 56 L19 64Z" fill="${HORN}"/>
    ${plates}
    ${legs([34,64],72,18,K)}

const FOOT = {tri:90,brachio:90,stego:90,rex:90,ankylo:90,ptera:66,para:90};

function dinoCardSVG(key){
  return `<svg viewBox="-4 6 128 90" aria-hidden="true">${dino(key,false)}</svg>`;
}

function starsSVG(r, n, yMax, big){
  let s="";
  for(let i=0;i<n;i++){
    const x=(r()*800).toFixed(1), y=(r()*yMax).toFixed(1), rad=(r()*(big?1.9:1.3)+.5).toFixed(2);
    s+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="#fff8e1" class="tw" style="animation-delay:${(r()*4).toFixed(2)}s"/>`;
  }
  return s;
}

function scene(pg, keys, idx){
  const r = rng(idx*97 + keys.length*13 + pg.set.length);
  const sleepy = !!pg.sleepy, fx = pg.fx||[];
  const breathe = fx.includes("breathe");
  let s = `<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset=".7" stop-color="#262f6b"/><stop offset="1" stop-color="#3a3f7e"/></linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff4cf" stop-opacity=".55"/><stop offset="1" stop-color="#fff4cf" stop-opacity="0"/></radialGradient>
    <radialGradient id="ffG"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".4" stop-color="#f2bc86" stop-opacity=".7"/><stop offset="1" stop-color="#f2bc86" stop-opacity="0"/></radialGradient>
    <radialGradient id="crys"><stop offset="0" stop-color="#cfc9ff" stop-opacity=".7"/><stop offset="1" stop-color="#cfc9ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="riverG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a7c"/><stop offset="1" stop-color="#18205a"/></linearGradient>
    <linearGradient id="caveG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1733"/><stop offset="1" stop-color="#2b2350"/></linearGradient>
    <clipPath id="archClip"><path d="M70 410 Q60 120 250 96 Q440 110 440 410Z"/></clipPath>
  </defs>`;

  const moon = (cx,cy,rad)=> `<g class="${breathe?'breathe':''}">
      <circle cx="${cx}" cy="${cy}" r="${rad*2.6}" fill="url(#moonGlow)"/>
      <circle cx="${cx}" cy="${cy}" r="${rad}" fill="#f4ebcb"/>
      <circle cx="${cx-rad*.35}" cy="${cy-rad*.2}" r="${rad*.16}" fill="#e2d6ad"/>
      <circle cx="${cx+rad*.3}" cy="${cy+rad*.3}" r="${rad*.11}" fill="#e2d6ad"/>
      ${sleepy?`<path d="M${cx-rad*.38} ${cy+rad*.05} q${rad*.12} ${rad*.1} ${rad*.24} 0 M${cx+rad*.12} ${cy+rad*.05} q${rad*.12} ${rad*.1} ${rad*.24} 0" stroke="#b6a777" stroke-width="2.5" fill="none" stroke-linecap="round"/>`:''}
    </g>`;

  let ground = 420;
  if(pg.set==="cave"){
    s += `<rect width="800" height="450" fill="url(#caveG)"/>`;
    s += `<g clip-path="url(#archClip)"><rect width="800" height="450" fill="url(#skyG)"/>${starsSVG(r,40,300,false)}
          ${moon(330,170,30)}
          <path d="M60 360 Q200 300 300 340 T460 330 L460 450 L60 450Z" fill="#1f2a5c"/>`;
    if(fx.includes("rain")||fx.includes("softrain")){
      const n = fx.includes("softrain")?14:46;
      s += `<g class="rain" stroke="#b9c6f5" stroke-width="1.6" stroke-linecap="round" opacity="${fx.includes('softrain')?.35:.55}">`;
      for(let i=0;i<n;i++){ const x=60+r()*400, y=60+r()*360; s+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} l-4 14"/>`; }
      s += `</g>`;
    }
    s += `</g>`;
    s += `<path d="M70 410 Q60 120 250 96 Q440 110 440 410" fill="none" stroke="#3a3163" stroke-width="16"/>`;
    // rock texture blobs
    for(let i=0;i<9;i++){ const x=470+r()*320, y=40+r()*300; s+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(18+r()*26).toFixed(0)}" ry="${(10+r()*14).toFixed(0)}" fill="#3a3163" opacity=".35"/>`; }
    // crystals
    const crystal=(x,y,sc,c)=>`<g transform="translate(${x} ${y}) scale(${sc})"><circle cx="0" cy="-14" r="34" fill="url(#crys)" class="glow"/>
      <path d="M-10 0 L-6 -26 L0 -36 L5 -24 L4 0Z" fill="${c}"/><path d="M2 0 L8 -20 L14 -26 L18 -12 L14 0Z" fill="${c}" opacity=".8"/><path d="M-20 0 L-16 -12 L-12 -16 L-8 0Z" fill="${c}" opacity=".75"/>
      <path d="M-6 -26 L0 -36 L0 0" fill="#fff" opacity=".18"/></g>`;
    s += crystal(720,400,1.4,"#a99ff0")+crystal(560,130,.9,"#8fb7ee")+crystal(760,180,1,"#c3b5f5")+crystal(40,430,1.1,"#8fb7ee");
    s += `<rect x="0" y="408" width="800" height="42" fill="#231c40"/>`;
    // fern nest when sleepy
    if(sleepy){
      s += `<ellipse cx="400" cy="430" rx="330" ry="22" fill="#2e4a48"/>`;
      for(let i=0;i<14;i++){ const x=90+i*47; s+=`<path d="M${x} 430 q10 -26 26 -30 q-6 16 -26 30" fill="#4c7a6c" opacity=".8"/>`; }
    }
    ground = 424;
  } else {
    s += `<rect width="800" height="450" fill="url(#skyG)"/>`;
    s += starsSVG(r, fx.includes("manystars")?110:60, 300, fx.includes("manystars"));
    s += moon(650,95,38);
    s += `<path d="M0 300 Q140 230 300 280 T620 260 T800 270 L800 450 L0 450Z" fill="#212a63"/>`;
    s += `<path d="M0 340 Q180 290 380 330 T800 320 L800 450 L0 450Z" fill="#1a2357"/>`;
    if(pg.set==="river"){
      s += `<path d="M0 332 Q200 318 400 334 T800 330 L800 382 Q600 372 400 386 T0 380Z" fill="url(#riverG)"/>`;
      // reflections
      for(let i=0;i<26;i++){ const x=r()*800, y=340+r()*36; s+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(2+r()*4).toFixed(1)}" ry="1" fill="#fff8e1" class="tw" style="animation-delay:${(r()*4).toFixed(2)}s"/>`; }
      s += `<ellipse cx="650" cy="358" rx="34" ry="5" fill="#f4ebcb" opacity=".35"/>`;
      if(fx.includes("ripple")) s += `<g fill="none" stroke="#cfd7ff" stroke-width="1.5"><ellipse class="ripple" cx="320" cy="360" rx="24" ry="5"/><ellipse class="ripple" style="animation-delay:1.7s" cx="320" cy="360" rx="24" ry="5"/><ellipse class="ripple" style="animation-delay:3.4s" cx="320" cy="360" rx="24" ry="5"/></g>`;
      s += `<path d="M0 384 Q200 374 400 388 T800 380 L800 450 L0 450Z" fill="#1d3a4c"/>`;
      // reeds
      [[24,0],[44,1],[60,2],[742,3],[760,4],[780,5]].forEach(([x,i])=>{ s+=`<g class="sway" style="animation-delay:${i*.6}s"><path d="M${x} 400 q${i%2?4:-4} -50 ${i%2?2:-2} -80" stroke="#3f6b62" stroke-width="3" fill="none"/><ellipse cx="${x+(i%2?2:-2)}" cy="322" rx="3.5" ry="10" fill="#6b5a46"/></g>`; });
      // willow
      s += `<g opacity=".9"><path d="M110 340 q-6 -80 10 -140" stroke="#1a2a3e" stroke-width="12" fill="none"/>`;
      for(let i=0;i<9;i++){ const x=60+i*14; s+=`<path class="sway" style="animation-delay:${i*.4}s" d="M${x} 200 q${(i-4)*2} 60 ${(i-4)*4} ${100+(i%3)*20}" stroke="#2f5a55" stroke-width="3" fill="none" opacity=".85"/>`; }
      s += `<ellipse cx="118" cy="200" rx="70" ry="30" fill="#24453f"/></g>`;
    } else {
      s += `<path d="M0 380 Q200 360 400 378 T800 372 L800 450 L0 450Z" fill="#1d3e47"/>`;
      // grass tufts & flowers
      for(let i=0;i<30;i++){ const x=r()*800, y=388+r()*55; s+=`<path d="M${x.toFixed(0)} ${y.toFixed(0)} l-3 -10 M${x.toFixed(0)} ${y.toFixed(0)} l0 -13 M${x.toFixed(0)} ${y.toFixed(0)} l3 -10" stroke="#3d6c66" stroke-width="2" stroke-linecap="round"/>`; }
      const fc=["#b9b3ec","#f2bc86","#f4ebcb","#e4a8c0"];
      for(let i=0;i<14;i++){ const x=r()*800, y=392+r()*50; s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="3.2" fill="${fc[i%4]}" opacity="${sleepy?.55:.85}"/>`; }
    }
    if(fx.includes("fireflies")){
      for(let i=0;i<14;i++){ const x=40+r()*720, y=150+r()*230; s+=`<circle class="ff" style="animation-delay:${(r()*7).toFixed(2)}s" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="9" fill="url(#ffG)"/>`; }
    }
  }

  // dinos
  const n = keys.length;
  const scale = n===1?1.9:n===2?1.7:1.45;
  const xs = n===1?[400]:n===2?[270,540]:[165,400,635];
  keys.forEach((k,i)=>{
    const sc = k==="ptera"&&!sleepy ? scale*.9 : scale;
    let gx = xs[i] - 60*sc;
    let gy = ground - FOOT[k]*sc;
    if(k==="ptera" && !sleepy) gy -= 150;
    const focus = pg.focus!==undefined && keys[pg.focus % n]===k && (pg.focus % n)===i;
    if(focus) s += `<ellipse cx="${xs[i]}" cy="${ground+2}" rx="${70*sc/1.6}" ry="10" fill="#f4ebcb" opacity=".16" class="glow"/>`;
    else s += `<ellipse cx="${xs[i]}" cy="${ground+3}" rx="${55*sc/1.6}" ry="7" fill="#000" opacity=".22"/>`;

        <text class="zz" x="${zx}" y="${zy}" font-size="20" style="animation-delay:${i*.8}s">z</text>
        <text class="zz" x="${zx+10}" y="${zy-6}" font-size="15" style="animation-delay:${i*.8+1.6}s">z</text>
        <text class="zz" x="${zx+18}" y="${zy-12}" font-size="12" style="animation-delay:${i*.8+3.2}s">z</text></g>`;
    }
  });
  s += `</svg>`;
  return s;
}

/* ================= Night sky canvas ================= */
(function sky(){
  const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars=[], w, h;
  function size(){
    const dpr = Math.min(2, devicePixelRatio||1);
    w = cv.clientWidth; h = cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const r = rng(7); stars = Array.from({length:Math.round(w*h/5000)},()=>({x:r()*w,y:r()*h,s:r()*1.3+.3,p:r()*6.28,v:.3+r()*.7}));
  }
  function draw(t){
    ctx.clearRect(0,0,w,h);
    for(const st of stars){
      const a = reduce ? .6 : .35 + .45*Math.sin(st.p + t*.0006*st.v);
      ctx.globalAlpha = a; ctx.fillStyle = "#fff6dc";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.s, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
    if(!reduce) requestAnimationFrame(draw);
  }
  addEventListener("resize", ()=>{ size(); if(reduce) draw(0); });
  size(); requestAnimationFrame(draw);
})();

function makeCtx(){
  let nm = state.name.trim() || "Little One";
  nm = nm.charAt(0).toUpperCase() + nm.slice(1);
  const D = state.picks.map(k=>({key:k, ...DINOS[k]}));
  return {
    name:nm, D, n:D.length,
    d:i=>D[i % D.length],
    list: joinNames(D.map(d=>d.name)),
    listFull: joinNames(D.map(d=>`${d.name} the ${d.kind}`)),
    were: D.length>1 ? "were" : "was"
  };
}

function startStory(st){
  current = {st, ctx:makeCtx()};
  page = 0;
  renderStory();
  scrollTo({top:0, behavior:"smooth"});
}

function pageText(pg){
  const c = current.ctx, young = state.age<=3;
  if(pg.kind==="actions") return actionsText(c, young);
  if(pg.kind==="goodnight") return goodnightText(c, current.st.place, young);
  return (young ? pg.short : pg.long)(c);
}

function renderStory(){
  const {st, ctx} = current, pages = st.pages, pg = pages[page], last = page===pages.length-1;
  const text = pageText(pg);
  const paras = text.split("\n").map(t=>`<p>${esc(t)}</p>`).join("");
  app.innerHTML = `
  <section class="story" aria-live="polite">
    <div class="topbar">
      <h2>${st.title}</h2>
      <div class="tools">
        <button class="ghost" id="readBtn" aria-pressed="${readAloud}" ${'speechSynthesis' in window?'':'hidden'}>${readAloud?'Reading aloud':'Read to me'}</button>
        <button class="ghost" id="homeBtn">Change story</button>
      </div>
    </div>
    <div class="pic">${scene(pg, ctx.D.map(d=>d.key), page)}</div>
    <div class="words fade">${last?`<h3>Goodnight, ${esc(ctx.name)}</h3>`:''}${paras}</div>
    ${last ? `<div class="endrow">
        <button class="navbtn primary" id="lightsBtn">Lights out</button>
        <button class="navbtn" id="againBtn">Read it again</button>
        <button class="navbtn" id="otherBtn">Another story</button>
      </div>` : `
    <div class="nav">
      <button class="navbtn" id="prevBtn" ${page===0?'disabled':''} aria-label="Previous page">← Back</button>
      <div class="dots" aria-label="Page ${page+1} of ${pages.length}">${pages.map((_,i)=>`<i class="${i<page?'done':i===page?'now':''}"></i>`).join("")}</div>
      <button class="navbtn primary" id="nextBtn" aria-label="Next page">Next →</button>
    </div>`}
  </section>`;
  document.getElementById("dim").style.opacity = Math.min(.42, page*.055);
  document.getElementById("homeBtn").onclick = renderSetup;
  const rb = document.getElementById("readBtn");
  rb.onclick = ()=>{ readAloud=!readAloud; rb.setAttribute("aria-pressed",readAloud); rb.textContent = readAloud?'Reading aloud':'Read to me'; readAloud ? speak(text) : stopSpeech(); };
  if(last){
    document.getElementById("againBtn").onclick = ()=>{ page=0; renderStory(); };
    document.getElementById("otherBtn").onclick = renderSetup;
    document.getElementById("lightsBtn").onclick = lightsOut;
  } else {
    document.getElementById("nextBtn").onclick = ()=>go(1);
    document.getElementById("prevBtn").onclick = ()=>go(-1);
  }
  if(readAloud) speak(text);
}
function go(d){
  const n = current.st.pages.length;
  const np = Math.max(0, Math.min(n-1, page+d));
  if(np===page) return;
  page = np; renderStory();
}

/* ---- read aloud ---- */
/* Ranks the device's voices so the warmest, most human ones come first.
   Neural / Natural / Enhanced / Premium voices sound far less robotic than the basic ones. */
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandpa|grandma|rocko|eddy|\bflo\b|reed|sandy|shelley/i;
function scoreVoice(v){
  if(!/^en/i.test(v.lang)) return -99;
  let s = 0; const n = v.name;
  if(NOVELTY.test(n)) s -= 30;
  if(/natural|neural/i.test(n)) s += 10;
  if(/premium/i.test(n)) s += 9;
  if(/enhanced|siri/i.test(n)) s += 7;
  if(/online/i.test(n)) s += 3;
  if(/google/i.test(n)) s += 2;
  if(/ava|samantha|serena|allison|susan|zoe|karen|moira|tessa|sonia|libby|jenny|aria|emma|michelle|female/i.test(n)) s += 3;
  if(/en[-_](us|gb)/i.test(v.lang)) s += 1;
  return s;
}
let voices = [];
function loadVoices(){
  try{ voices = speechSynthesis.getVoices().filter(v=>scoreVoice(v)>-99).sort((a,b)=>scoreVoice(b)-scoreVoice(a)); }catch(e){ voices = []; }
  fillVoices();
}
function currentVoice(){
  return voices.find(v=>v.voiceURI===state.voiceURI) || voices.find(v=>scoreVoice(v)>-20) || voices[0] || null;
}
function prettyName(v){
  return v.name.replace(/^Microsoft\s+/,"").replace(/\s*-\s*English.*$/,"").replace(/\s*\(.*?English.*?\)/,"");
}
function fillVoices(){
  const sel = document.getElementById("voiceSel"); if(!sel) return;
  const cur = currentVoice();
  if(!voices.length){ sel.innerHTML = `<option>Loading voices…</option>`; return; }
  sel.innerHTML = voices.filter(v=>scoreVoice(v)>-20).map(v=>{
    const tag = scoreVoice(v)>=7 ? " · most natural" : "";
    return `<option value="${esc(v.voiceURI)}" ${cur&&v.voiceURI===cur.voiceURI?'selected':''}>${esc(prettyName(v))}${tag}</option>`;
  }).join("");
}
function sampleLine(){
  const nm = (document.getElementById("childName")?.value || state.name || "").trim() || "little one";
  return `Once upon a time, a sleepy little dinosaur gave a big, slow yawn...\nand whispered, "Goodnight, ${nm}."`;
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

const RATES = {regular:1, calm:.86, slow:.74};
const PITCH = {regular:1, calm:.96, slow:.94};
const PAUSE = {regular:.45, calm:1, slow:1.3};
let speakToken = 0, speakTimer = null;
/* Speaks one phrase at a time with real pauses between them, the way a parent reads:
   a short rest after each sentence, a longer rest after "..." and at the end of each line. */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  stopSpeech();
  const my = ++speakToken, q = [];
  text.split("\n").forEach(line=>{
    const parts = line.match(/[^.!?]+(?:\.\.\.|[.!?])+["”]?|[^.!?]+$/g) || [];
    parts.forEach((p,i)=>{
      const t = p.trim(); if(!t) return;
      const trailing = /\.\.\.["”]?$/.test(t);
      const f = PAUSE[state.pace] || .45;
      q.push({ t: t.replace(/\.\.\./g,",").replace(/["“”]/g,"").replace(/,\s*$/,"."),
               pause: Math.round(((trailing?1200:700) + (i===parts.length-1?600:0)) * f) });
    });
  });
  let i = 0;
  const next = ()=>{
    if(my!==speakToken || i>=q.length) return;
    const {t, pause} = q[i++];
    try{
      const u = new SpeechSynthesisUtterance(t);
      const v = currentVoice(); if(v){ u.voice = v; u.lang = v.lang; }
      u.rate = RATES[state.pace] || 1; u.pitch = PITCH[state.pace] || 1; u.volume = 1;
      u.onend = ()=>{ if(my===speakToken) speakTimer = setTimeout(next, pause); };
      u.onerror = u.onend;
      speechSynthesis.speak(u);
    }catch(e){}
  };
  speakTimer = setTimeout(next, 250);
}
function stopSpeech(){ speakToken++; clearTimeout(speakTimer); try{ speechSynthesis.cancel(); }catch(e){} }

/* ---- lights out ---- */
const lights = document.getElementById("lights");
function lightsOut(){
  stopSpeech();
  document.getElementById("lightsText").textContent = `Goodnight, ${current.ctx.name}`;
  lights.hidden = false; requestAnimationFrame(()=>requestAnimationFrame(()=>lights.classList.add("on")));
  lights.focus();
}
function lightsOn(){ lights.classList.remove("on"); setTimeout(()=>lights.hidden=true, 600); }
lights.onclick = lightsOn;
lights.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); lightsOn(); } };

addEventListener("keydown", e=>{
  if(!current || !document.querySelector(".story") || !lights.hidden) return;
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});

renderSetup();
</script>
</body>
